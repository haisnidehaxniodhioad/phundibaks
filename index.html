<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3a5bb5">
  <title>トレーニング管理</title>
  <link rel="stylesheet" href="style.css?v=3c">
</head>
<body>
  <!-- 画面の中身は app.js が組み立てる -->
  <div id="app" class="wrap"><div class="loading">読み込み中…</div></div>
  <div id="timer"></div>
  <!-- 音声操作（Phase 2）: マイクボタンと、聞き取った文の表示 -->
  <div id="voiceBox" class="voice-box" hidden></div>
  <button id="micBtn" class="mic-fab" hidden>🎤 話しかける</button>

  <!-- ?v=… は古いファイルが残らないようにするための印（更新のたびに変える）。config.js は変えない -->
  <!-- 読み込む順番に意味がある（設定 → 通信 → 読み上げ → 聞き取り → 画面 → 音声操作） -->
  <script src="config.js"></script>
  <script src="api.js?v=3c"></script>
  <script src="speech.js?v=3c"></script>
  <script src="voice.js?v=3c"></script>
  <script src="app.js?v=3c"></script>
  <script src="body.js?v=3c"></script>
  <script src="import.js?v=3c"></script>
  <script src="staff.js?v=3c"></script>
  <script src="staff_body.js?v=3c"></script>
  <script src="export.js?v=3c"></script>
  <script src="commands.js?v=3c"></script>
</body>
</html>
