<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f2f2">
  <title>トレーニング管理</title>
  <!-- 文字の形（明朝体）。読み込めないときは端末の明朝体で表示される -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <!-- 画面の中身は app.js が組み立てる -->
  <div id="app" class="wrap"><div class="loading">読み込み中…</div></div>

  <!-- 画面の下のバー（dock.js）。上の段＝コーチと吹き出し、下の段＝タブ／タイマー／保存ボタン（画面で変わる） -->
  <div id="dock" class="dock" hidden>
    <div id="dockCoach" class="dock-coach">
      <span id="dockAvatarSlot" class="dock-avatar"></span>
      <div class="dock-bubble">
        <!-- 聞き取った文と返事（commands.js）。返事が無いときは下の coachLine（その画面のひとこと）が出る -->
        <div id="voiceBox" class="voice-box" hidden></div>
        <div id="coachLine" class="coach-line"></div>
      </div>
    </div>
    <div id="dockBar" class="dock-bar"></div>
  </div>
  <!-- マイクボタンとレストタイマー。dock.js がバーの中の決まった場所に移す -->
  <button id="micBtn" class="mic-btn" hidden aria-label="話しかける"></button>
  <div id="timer"></div>

  <!-- ?v=21… は古いファイルが残らないようにするための印（更新のたびに変える）。config.js は変えない -->
  <!-- 読み込む順番に意味がある（設定 → 通信 → 絵 → 読み上げ → 聞き取り → 画面 → 音声操作 → 下のバー） -->
  <script src="config.js"></script>
  <script src="api.js?v=26"></script>
  <script src="icons.js?v=26"></script>
  <script src="readings.js?v=26"></script>
  <script src="speech.js?v=26"></script>
  <script src="voice.js?v=26"></script>
  <script src="app.js?v=26"></script>
  <script src="body.js?v=26"></script>
  <script src="import.js?v=26"></script>
  <script src="staff.js?v=26"></script>
  <script src="staff_body.js?v=26"></script>
  <script src="export.js?v=26"></script>
  <script src="body_base.js?v=26"></script>
  <script src="mymenu.js?v=26"></script>
  <script src="history.js?v=26"></script>
  <script src="avatar.js?v=26"></script>
  <script src="chat.js?v=26"></script>
  <script src="commands.js?v=26"></script>
  <script src="dock.js?v=26"></script>
</body>
</html>
