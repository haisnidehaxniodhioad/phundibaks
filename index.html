<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F1F0EC">
  <title>トレーニング管理</title>
  <!-- 文字の形（角ゴシック＝Zen Kaku Gothic New）。読み込めないときは端末のゴシック体で表示される -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css?v=44">
  <!-- 昼／夜の色を、画面が出る前に決める（theme.js） -->
  <script src="theme.js?v=44"></script>
</head>
<body>
  <!-- 画面の上の帯（v30）：コーチと吹き出し。吹き出しには返事（#voiceBox）か、その画面のひとこと（#coachLine）が出る -->
  <header id="dockCoach" class="coach-band" hidden>
    <div class="coach-band-in">
      <span id="dockAvatarSlot" class="dock-avatar"></span>
      <div class="dock-bubble">
        <!-- 聞き取った文と返事（commands.js）。返事が無いときは下の coachLine（その画面のひとこと）が出る -->
        <div id="voiceBox" class="voice-box" hidden></div>
        <div id="coachLine" class="coach-line"></div>
      </div>
    </div>
  </header>

  <!-- 画面の中身は app.js が組み立てる -->
  <div id="app" class="wrap"><div class="loading">読み込み中…</div></div>

  <!-- 画面の下のバー（dock.js）。タブ／タイマー／保存ボタン（画面で変わる） -->
  <div id="dock" class="dock" hidden>
    <div id="dockBar" class="dock-bar"></div>
  </div>
  <!-- マイクボタンとレストタイマー。dock.js がバーの中の決まった場所に移す -->
  <button id="micBtn" class="mic-btn" hidden aria-label="話しかける"></button>
  <div id="timer"></div>

  <!-- ?v=21… は古いファイルが残らないようにするための印（更新のたびに変える）。config.js は変えない -->
  <!-- 読み込む順番に意味がある（設定 → 通信 → 絵 → 読み上げ → 聞き取り → 画面 → 音声操作 → 下のバー） -->
  <script src="config.js"></script>
  <script src="api.js?v=44"></script>
  <script src="icons.js?v=44"></script>
  <script src="readings.js?v=44"></script>
  <script src="speech.js?v=44"></script>
  <script src="voice.js?v=44"></script>
  <script src="app.js?v=44"></script>
  <script src="body.js?v=44"></script>
  <script src="import.js?v=44"></script>
  <!-- v34：コンディションの推移のグラフ（スタッフ画面の選手詳細） -->
  <script src="condchart.js?v=44"></script>
  <script src="staff.js?v=44"></script>
  <script src="staff_body.js?v=44"></script>
  <script src="roster.js?v=44"></script>
  <script src="export.js?v=44"></script>
  <script src="body_base.js?v=44"></script>
  <script src="mymenu.js?v=44"></script>
  <script src="history.js?v=44"></script>
  <script src="avatar.js?v=44"></script>
  <script src="chat.js?v=44"></script>
  <!-- v31：自分のデータの質問に答える（体組成・自己ベスト・順位など） -->
  <!-- v42：ページの見方・言葉の意味 -->
  <script src="guide.js?v=44"></script>
  <script src="qa.js?v=44"></script>
  <!-- v33：コンディション（疲労度・パフォーマンスの質・コメント）の記録 -->
  <script src="condition.js?v=44"></script>
  <script src="commands.js?v=44"></script>
  <!-- v35：スタッフ画面の会話（質問に答える・話しかけて操作する） -->
  <script src="staff_qa.js?v=44"></script>
  <script src="staff_voice.js?v=44"></script>
  <script src="dock.js?v=44"></script>
</body>
</html>
